<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1350px;
      background: #020204;
      color: #f1f3f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      background: radial-gradient(circle at 85% 15%, rgba(230, 57, 70, 0.16) 0%, transparent 45%),
                  radial-gradient(circle at 10% 85%, rgba(20, 80, 160, 0.18) 0%, transparent 50%),
                  #07080d;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    /* Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    .badge {
      background: #e63946;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .source-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #838b9f;
      letter-spacing: 1px;
      margin-left: 10px;
    }

    .read-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #9ea6bc;
      letter-spacing: 1px;
    }

    /* Headline */
    .headline-wrap {
      margin: 28px 0 24px 0;
    }

    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* Hero Frame */
    .hero-frame {
      width: 100%;
      height: 490px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95);
      background: #0d0f17;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.1) brightness(0.9);
      display: block;
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 65%, rgba(7, 8, 13, 0.9) 100%);
    }

    /* Quote Card */
    .insight-card {
      background: rgba(18, 21, 31, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #e63946;
      border-radius: 14px;
      padding: 22px 28px;
      margin-top: 24px;
    }

    .author-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .author-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .author-handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #727a92;
    }

    .insight-quote {
      font-size: 20px;
      line-height: 1.4;
      color: #d6ddf2;
      font-weight: 500;
    }

    /* Metric & Footer */
    .metric-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px 28px;
      margin-top: 20px;
    }

    .metric-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 800;
      color: #e63946;
      letter-spacing: -1px;
    }

    .metric-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #8a91a6;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-left: 14px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-align: right;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #656b80;
      letter-spacing: 1px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="canvas">
    <div class="header-bar">
      <div>
        <span class="badge">{{TAG}}</span>
        <span class="source-label">SILICON RADAR</span>
      </div>
      <div class="read-time">{{READ_TIME}}</div>
    </div>

    <div class="headline-wrap">
      <h1 class="headline">{{HEADLINE}}</h1>
    </div>

    <div class="hero-frame">
      <img class="hero-img" src="{{IMAGE_URL}}" alt="Visual" />
      <div class="hero-gradient"></div>
    </div>

    <div class="insight-card">
      <div class="author-line">
        <span class="author-name">{{TWEET_AUTHOR}}</span>
        <span class="author-handle">{{TWEET_HANDLE}}</span>
      </div>
      <p class="insight-quote">“{{TWEET_TEXT}}”</p>
    </div>

    <div class="metric-strip">
      <div style="display:flex; align-items:baseline;">
        <span class="metric-value">{{METRIC_VAL}}</span>
        <span class="metric-desc">{{METRIC_LABEL}}</span>
      </div>
      <div>
        <div class="brand-title">CULTYNEX TERMINAL</div>
        <div class="brand-sub">DAILY INTEL BRIEF</div>
      </div>
    </div>
  </div>

</body>
</html>
