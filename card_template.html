<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      background: #040507;
      color: #f1f3f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      background: radial-gradient(circle at 80% 10%, rgba(230, 57, 70, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 10% 90%, rgba(30, 60, 114, 0.15) 0%, transparent 50%),
                  #07080c;
      padding: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Top Metadata */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
    }

    .tag-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #e63946;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .source-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #7a829e;
      letter-spacing: 1px;
    }

    .read-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #9da5c0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Headline */
    .headline-wrap {
      margin-top: 36px;
      margin-bottom: 30px;
    }

    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 46px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    /* Center Visual Frame */
    .hero-frame {
      width: 100%;
      height: 480px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
      background: #11131a;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.08) brightness(0.95);
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(7, 8, 12, 0.85) 100%);
    }

    /* Analysis & Reaction Section */
    .insight-card {
      background: rgba(18, 20, 29, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px 28px;
      margin-top: 28px;
      position: relative;
    }

    .insight-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      background: #e63946;
      border-radius: 0 4px 4px 0;
    }

    .author-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .author-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .author-handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #6c738a;
    }

    .insight-quote {
      font-size: 18px;
      line-height: 1.45;
      color: #c9d1e9;
      font-weight: 500;
    }

    /* Metrics Strip */
    .metric-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 20px 28px;
      margin-top: 20px;
    }

    .metric-left {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .metric-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 38px;
      font-weight: 800;
      color: #e63946;
      letter-spacing: -1px;
    }

    .metric-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #8c93a8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #656b82;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="canvas">
    
    <!-- Top Metadata -->
    <div class="header-bar">
      <div class="tag-container">
        <span class="badge">{{TAG}}</span>
        <span class="source-label">INTEL DISPATCH</span>
      </div>
      <div class="read-time">{{READ_TIME}}</div>
    </div>

    <!-- Editorial Headline -->
    <div class="headline-wrap">
      <h1 class="headline">{{HEADLINE}}</h1>
    </div>

    <!-- Hero Visual -->
    <div class="hero-frame">
      <img class="hero-img" src="{{IMAGE_URL}}" alt="Dispatch Visual" />
      <div class="hero-overlay"></div>
    </div>

    <!-- Insight Reaction -->
    <div class="insight-card">
      <div class="author-line">
        <span class="author-name">{{TWEET_AUTHOR}}</span>
        <span class="author-handle">{{TWEET_HANDLE}}</span>
      </div>
      <p class="insight-quote">“{{TWEET_TEXT}}”</p>
    </div>

    <!-- Metrics Bar & Brand Footer -->
    <div class="metric-strip">
      <div class="metric-left">
        <div class="metric-value">{{METRIC_VAL}}</div>
        <div class="metric-desc">{{METRIC_LABEL}}</div>
      </div>
      <div class="footer-brand">
        <span class="brand-title">CULTYNEX MEDIA</span>
        <span class="brand-sub">DAILY INTELLIGENCE</span>
      </div>
    </div>

  </div>

</body>
</html>
