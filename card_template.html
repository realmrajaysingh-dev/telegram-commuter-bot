<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      width: 1080px;
      height: 1350px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
    }
    .card {
      width: 1080px;
      height: 1350px;
      background: #0D0F12;
      color: #FFF;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 24px;
    }
    .pill {
      background: #E53935;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 8px 20px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .read-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: #8E9297;
      letter-spacing: 1px;
    }
    .headline {
      font-family: 'Cinzel', serif;
      font-size: 52px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin: 28px 0;
      color: #F8F9FA;
    }
    .image-box {
      width: 100%;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      position: relative;
    }
    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tweet-card {
      background: #16181C;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px 28px;
      margin-top: 24px;
    }
    .tweet-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .tweet-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #272C34;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }
    .tweet-author { font-size: 20px; font-weight: 700; color: #FFF; }
    .tweet-handle { font-size: 16px; color: #71767B; }
    .tweet-text {
      font-size: 20px;
      line-height: 1.45;
      color: #E7E9EA;
    }
    .metric-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(229, 57, 53, 0.08);
      border: 1px solid rgba(229, 57, 53, 0.35);
      border-radius: 12px;
      padding: 16px 24px;
      margin-top: 20px;
    }
    .metric-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 800;
      color: #E53935;
    }
    .metric-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #C0C4CC;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .cta-btn {
      background: #E53935;
      color: #FFF;
      font-size: 20px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 10px;
      text-decoration: none;
    }
    .footer-right {
      font-size: 15px;
      color: #71767B;
      text-align: right;
      line-height: 1.4;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <div class="pill">{{TAG}}</div>
      <div class="read-time">{{READ_TIME}}</div>
    </div>
    
    <div class="headline">{{HEADLINE}}</div>
    
    <div class="image-box">
      <img src="{{IMAGE_URL}}" alt="Visual">
    </div>
    
    <div class="tweet-card">
      <div class="tweet-header">
        <div class="tweet-avatar">X</div>
        <div>
          <div class="tweet-author">{{TWEET_AUTHOR}}</div>
          <div class="tweet-handle">{{TWEET_HANDLE}}</div>
        </div>
      </div>
      <div class="tweet-text">{{TWEET_TEXT}}</div>
    </div>
    
    <div class="metric-badge">
      <div class="metric-val">{{METRIC_VAL}}</div>
      <div class="metric-label">{{METRIC_LABEL}}</div>
    </div>
    
    <div class="footer">
      <div class="cta-btn">Cultynex Dispatch on Telegram &rarr;</div>
      <div class="footer-right">
        TELEGRAM & WEB<br>DAILY INTELLIGENCE
      </div>
    </div>
  </div>
</body>
</html>
