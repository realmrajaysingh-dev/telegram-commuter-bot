name: Telegram Daily Editorial Publisher

on:
  schedule:
    # Runs 5 times daily (UTC timings: 2:30 AM, 5:30 AM, 9:30 AM, 12:30 PM, 3:30 PM) -> IST peak commute hours
    - cron: '30 2,5,9,12,15 * * *'
  workflow_dispatch: # Allows manual 1-click run anytime

permissions:
  contents: write # Allows the workflow to commit and push generated articles

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests playwright
          playwright install --with-deps chromium

      - name: Run Editorial Dispatcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python bot.py

      - name: Commit & Push Generated Articles
        run: |
          git config --global user.name "Cultynex Bot"
          git config --global user.email "bot@cultynex.media"
          git add articles/
          git commit -m "Auto-publish new longform intel article [skip ci]" || echo "No new article files to commit"
          git push
