<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CULTYNEX STUDIO | Autonomous Agent Control Plane</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #07080b; color: #e4e7eb; padding: 20px 15px; display: flex; justify-content: center; min-height: 100vh; }
    
    .panel { width: 100%; max-width: 480px; background: rgba(14, 16, 23, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { background: #e63946; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 4px; letter-spacing: 1.5px; font-family: 'JetBrains Mono', monospace; }
    .agent-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00ff88; display: flex; align-items: center; gap: 6px; }
    .agent-dot { width: 7px; height: 7px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; }

    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #fff; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #7f869a; margin-bottom: 22px; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #9da4be; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    input, textarea { width: 100%; background: #12141c; border: 1px solid #232736; border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
    input:focus, textarea:focus { border-color: #e63946; box-shadow: 0 0 10px rgba(230,57,70,0.3); }

    .btn-main { width: 100%; background: #e63946; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.5px; margin-top: 10px; }
    .btn-main:active { transform: scale(0.98); opacity: 0.9; }
    .btn-main:disabled { background: #262936; cursor: not-allowed; color: #6f768d; }

    /* Live Telemetry Terminal */
    .telemetry-box { margin-top: 22px; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: #0a0b10; overflow: hidden; }
    .t-header { background: #12141d; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8e95ab; }
    .t-body { padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; max-height: 220px; overflow-y: auto; color: #cbd2e1; }
    .t-log-entry { margin-bottom: 6px; word-break: break-all; }
    .t-success { color: #00ff88; font-weight: 700; }
    .t-error { color: #ff4d5e; font-weight: 700; }
    .t-warn { color: #ffb703; }

    .quick-links { margin-top: 18px; display: flex; justify-content: space-between; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
    .quick-links a { color: #0088cc; text-decoration: none; }
  </style>
</head>
<body>

<div class="panel">
  <div class="badge-bar">
    <div class="badge">CULTYNEX AUTONOMOUS CONTROL</div>
    <div class="agent-status"><span class="agent-dot"></span> AGENT READY</div>
  </div>

  <h1>Mission Studio Deck</h1>
  <p class="sub">Trigger dispatches, monitor real-time pipeline status, and inspect backend logs.</p>

  <div class="field">
    <label>GitHub Personal Token (PAT)</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  </div>

  <div class="field">
    <label>Custom Editorial Instruction / Focus (Optional)</label>
    <textarea id="agentPrompt" rows="2" placeholder="e.g. Focus specifically on TSMC sub-1.4nm High-NA EUV yield challenges..."></textarea>
  </div>

  <button class="btn-main" id="execBtn" onclick="triggerWorkflow()">
    <span>⚡ BROADCAST & MONITOR RUN</span>
  </button>

  <!-- Live Status & Error Monitor Window -->
  <div class="telemetry-box">
    <div class="t-header">
      <span>PIPELINE TELEMETRY</span>
      <span id="runStatusLabel">IDLE</span>
    </div>
    <div class="t-body" id="consoleLogs">
      <div class="t-log-entry t-warn">// System ready. Click BROADCAST to start pipeline run.</div>
    </div>
  </div>

  <div class="quick-links">
    <a href="./" target="_blank">&larr; Open Public Portal</a>
    <a href="https://github.com/realmrajaysingh-dev/telegram-commuter-bot/actions" target="_blank">Full Action Logs &rarr;</a>
  </div>
</div>

<script>
  const REPO = "realmrajaysingh-dev/telegram-commuter-bot";
  const WORKFLOW_ID = "daily_bot.yml";
  
  const savedToken = localStorage.getItem("c_gh_token");
  if (savedToken) document.getElementById("ghToken").value = savedToken;

  function appendLog(msg, type = "normal") {
    const consoleLogs = document.getElementById("consoleLogs");
    const div = document.createElement("div");
    div.className = "t-log-entry " + (type === "err" ? "t-error" : type === "ok" ? "t-success" : type === "warn" ? "t-warn" : "");
    const time = new Date().toLocaleTimeString();
    div.innerText = `[${time}] ${msg}`;
    consoleLogs.appendChild(div);
    consoleLogs.scrollTop = consoleLogs.scrollHeight;
  }

  async function triggerWorkflow() {
    const token = document.getElementById("ghToken").value.trim();
    const btn = document.getElementById("execBtn");
    const statusLabel = document.getElementById("runStatusLabel");

    if (!token) {
      alert("Please enter your GitHub Personal Access Token!");
      return;
    }

    localStorage.setItem("c_gh_token", token);
    btn.disabled = true;
    btn.innerText = "RUNNING PIPELINE...";
    statusLabel.innerText = "TRIGGERING";
    statusLabel.style.color = "#ffb703";

    appendLog("Sending trigger dispatch to GitHub Actions...", "warn");

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ ref: "main" })
      });

      if (res.status === 204) {
        appendLog("Workflow acknowledged by GitHub cloud runner.", "ok");
        pollWorkflowStatus(token);
      } else {
        const data = await res.json().catch(() => ({}));
        appendLog("Failed to trigger: " + (data.message || "Unknown error"), "err");
        resetBtn();
      }
    } catch (err) {
      appendLog("Network error: " + err.message, "err");
      resetBtn();
    }
  }

  async function pollWorkflowStatus(token) {
    const statusLabel = document.getElementById("runStatusLabel");
    statusLabel.innerText = "OBSERVING";
    appendLog("Connecting to run monitoring engine (polling every 5s)...");

    let attempts = 0;
    const interval = setInterval(async () => {
      attempts++;
      if (attempts > 30) { // 2.5 minutes timeout
        clearInterval(interval);
        appendLog("Observation timed out. Check Actions tab directly.", "warn");
        resetBtn();
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=1`, {
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`
          }
        });
        const data = await res.json();
        if (data.workflow_runs && data.workflow_runs.length > 0) {
          const run = data.workflow_runs[0];
          statusLabel.innerText = run.status.toUpperCase();

          if (run.status === "completed") {
            clearInterval(interval);
            if (run.conclusion === "success") {
              statusLabel.style.color = "#00ff88";
              appendLog("PIPELINE SUCCESS: Editorial card & article published to Telegram & Web!", "ok");
            } else {
              statusLabel.style.color = "#ff4d5e";
              appendLog(`RUN FAILED (Conclusion: ${run.conclusion}).`, "err");
              fetchFailureLogs(token, run.jobs_url);
            }
            resetBtn();
          } else {
            appendLog(`Runner state: ${run.status} (${run.name})...`);
          }
        }
      } catch (e) {
        console.error(e);
      }
    }, 5000);
  }

  async function fetchFailureLogs(token, jobsUrl) {
    appendLog("Scanning runner logs for failure reason...", "warn");
    try {
      const res = await fetch(jobsUrl, {
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`
        }
      });
      const data = await res.json();
      if (data.jobs && data.jobs.length > 0) {
        const job = data.jobs[0];
        const failedStep = job.steps.find(s => s.conclusion === "failure");
        if (failedStep) {
          appendLog(`Failed at step: "${failedStep.name}".`, "err");
          appendLog(`Status code: ${failedStep.number}. Agent analysis recommended.`, "err");
        }
      }
    } catch (e) {
      appendLog("Could not fetch detailed job error: " + e.message, "err");
    }
  }

  function resetBtn() {
    const btn = document.getElementById("execBtn");
    btn.disabled = false;
    btn.innerText = "⚡ BROADCAST & MONITOR RUN";
  }
</script>

</body>
</html>
